name: MCK email intake bridge
on:
  push:
    branches: [fix/mck-email-to-intake-20261020, fix/mck-complete-form-capture-20261021]
  pull_request:
    branches: [redis-degraded-mode-20260816]
    paths:
      - services/shared/mck_email_parser.py
      - services/core/mck_email_bridge.py
      - services/core/mck_email_runtime.py
      - services/core/mck_form_capture.py
      - services/core/audit_mck_form_capture.py
      - services/intake/test_mck_email_bridge.py
      - services/intake/test_mck_form_capture_db.py
      - .github/workflows/mck-email-bridge.yml
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: capture_tests
        ports: [5432:5432]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r services/core/requirements.txt
      - name: Parser, orchestration and existing delivery contracts
        run: |
          set -euo pipefail
          python services/intake/test_mck_email_bridge.py -v
          python services/intake/test_business_channels.py -v
          python services/intake/test_mck_automation.py -v
          python services/intake/test_intake_delivery.py -v
          python services/intake/test_mck_reliability.py -v
          python services/intake/test_zoho_bootstrap.py -v
          python -m py_compile services/core/mck_email_bridge.py services/core/mck_email_runtime.py services/core/mck_form_capture.py services/core/audit_mck_form_capture.py services/shared/mck_email_parser.py
      - name: Disposable database source capture and contact backfill
        env:
          MCK_CAPTURE_TEST_DSN: postgresql://postgres:synthetic-ci-only@127.0.0.1:5432/capture_tests
        run: python services/intake/test_mck_form_capture_db.py -v
