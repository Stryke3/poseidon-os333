name: MCK safety regression proof
on:
  push:
    branches: ["fix/mck-runtime-safety-20261019", "redis-degraded-mode-20260816"]
    paths:
      - "services/core/conveyor_api.py"
      - "services/shared/business_mail.py"
      - "services/shared/zoho_mail_outbound.py"
      - "services/shared/zoho_sheet.py"
      - "services/shared/mommy_care_workflow.py"
      - "services/intake/**"
      - ".github/workflows/mck-safety.yml"
  pull_request:
    branches: ["redis-degraded-mode-20260816"]
    paths:
      - "services/core/conveyor_api.py"
      - "services/shared/business_mail.py"
      - "services/shared/zoho_mail_outbound.py"
      - "services/shared/zoho_sheet.py"
      - "services/shared/mommy_care_workflow.py"
      - "services/intake/**"
      - ".github/workflows/mck-safety.yml"
permissions:
  contents: read
jobs:
  safety-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: synthetic_test_only
          POSTGRES_USER: mck_test
          POSTGRES_DB: mck_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mck_test -d mck_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      LOCAL_PROOF_MODE: "true"
      MCK_TEST_DATABASE_URL: postgresql://mck_test:synthetic_test_only@localhost:5432/mck_test
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r services/core/requirements.txt
      - run: python services/intake/test_business_channels.py -v
      - run: python services/intake/test_mck_automation.py -v
      - run: python services/intake/test_mck_safety_regressions.py -v
      - run: python services/intake/test_mck_paid_dispatch.py -v
      - run: python -m py_compile services/core/conveyor_api.py services/shared/zoho_sheet.py services/shared/business_mail.py services/intake/main.py
      - run: git diff --check
